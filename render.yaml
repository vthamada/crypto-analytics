services:
  - type: web
    name: crypto-analytics-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: SCANNER_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_AGGREGATION_URL
        sync: false
      - key: LOG_AGGREGATION_TOKEN
        sync: false

  - type: worker
    name: crypto-analytics-worker
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: SCANNER_ENABLED
        value: "true"
      - key: SCAN_INTERVAL_SECONDS
        value: "300"
      - key: HISTORY_RETENTION_DAYS
        value: "30"
      - key: PIPELINE_AUDIT_MODE
        value: compact
      - key: PIPELINE_EVENT_RETENTION_DAYS
        value: "7"
      - key: SCANNER_CYCLE_AUDIT_RETENTION_DAYS
        value: "30"
      - key: RAW_MARKET_OBSERVATIONS_ENABLED
        value: "false"
      - key: REPETITION_PERSIST_INTERVAL_SECONDS
        value: "300"
      - key: SCANNER_STATE_PERSIST_INTERVAL_SECONDS
        value: "300"
      - key: LOG_LEVEL
        value: INFO
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_AGGREGATION_URL
        sync: false
      - key: LOG_AGGREGATION_TOKEN
        sync: false
